[project]
name = "kruinlijn-detectie"
version = "0.1.0"
description = "Detectie van kruinlijnen op dijken via morfologische analyse en deep learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.13",
    "fiona>=1.9",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dl = [
    "torch>=2.0",
    "torchvision>=0.15",
    "segmentation-models-pytorch>=0.3",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
